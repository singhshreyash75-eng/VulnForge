
services:
  input-api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      LAB_MODE: ${LAB_MODE:-patched}

    ports:
      - "127.0.0.1:18081:8000"

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

    networks:
      - input_lab_internal

networks:
  input_lab_internal:
    driver: bridge
